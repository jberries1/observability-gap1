name: gap4

services:
  db:
    image: mariadb:11.4
    container_name: gap4-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppass
    volumes:
      - db-data:/var/lib/mysql
      - ./db/exporter-user.sql:/docker-entrypoint-initdb.d/10-exporter-user.sql:ro
    networks: [gap4]

  php:
    image: wordpress:6.8-php8.3-fpm
    container_name: gap4-php
    restart: unless-stopped
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp-data:/var/www/html
      - ./cms/php-fpm-status.conf:/usr/local/etc/php-fpm.d/zz-status.conf:ro
    networks: [gap4]

  web:
    image: nginx:1.27-alpine
    container_name: gap4-web
    restart: unless-stopped
    depends_on: [php]
    ports:
      - "8080:80"
    volumes:
      - wp-data:/var/www/html:ro
      - ./nginx/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [gap4]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: gap4-node-exporter
    restart: unless-stopped
    # Смотрит на хост целиком: сеть хоста, его процессы и корневая ФС.
    # Слушает только на шлюзе docker-сети gap4 — снаружи порт недоступен,
    # достучаться может только exporters-gw.
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=172.28.4.1:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)'
      - '--collector.netdev.device-exclude=^(lo|veth.*|br-.*|docker.*)$$'

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: gap4-nginx-exporter
    restart: unless-stopped
    depends_on: [web]
    command:
      - '--nginx.scrape-uri=http://web:80/stub_status'
      - '--web.listen-address=:9113'
    networks: [gap4]

  phpfpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: gap4-phpfpm-exporter
    restart: unless-stopped
    depends_on: [php]
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://php:9000/status"
      PHP_FPM_WEB_LISTEN_ADDRESS: ":9253"
    networks: [gap4]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: gap4-mysqld-exporter
    restart: unless-stopped
    depends_on: [db]
    command:
      - '--mysqld.address=db:3306'
      - '--mysqld.username=exporter'
      - '--web.listen-address=:9104'
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporterpass
    networks: [gap4]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: gap4-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [gap4]

  exporters-gw:
    image: nginx:1.27-alpine
    container_name: gap4-exporters-gw
    restart: unless-stopped
    depends_on:
      - node-exporter
      - nginx-exporter
      - phpfpm-exporter
      - mysqld-exporter
      - blackbox-exporter
    ports:
      - "9443:9443"
    volumes:
      - ./nginx/exporters-gw.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [gap4]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.110.0
    container_name: gap4-victoriametrics
    restart: unless-stopped
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=2w'
      - '-httpListenAddr=:8428'
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
    networks: [gap4]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gap4-prometheus
    restart: unless-stopped
    depends_on: [exporters-gw, victoriametrics]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./tls:/etc/prom-tls:ro
      - prom-data:/prometheus
    networks: [gap4]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: gap4-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets:/etc/am-secrets:ro
      - am-data:/alertmanager
    networks: [gap4]

  grafana:
    image: grafana/grafana:13.2.2
    container_name: gap4-grafana
    restart: unless-stopped
    depends_on: [prometheus, victoriametrics, alertmanager]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/gf-secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/app/cms-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./secrets:/run/gf-secrets:ro
      - grafana-data:/var/lib/grafana
    networks: [gap4]

volumes:
  db-data:
  wp-data:
  prom-data:
  am-data:
  vm-data:
  grafana-data:

networks:
  gap4:
    ipam:
      config:
        - subnet: 172.28.4.0/24
          gateway: 172.28.4.1
