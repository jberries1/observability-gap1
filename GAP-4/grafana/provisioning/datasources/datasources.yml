apiVersion: 1

datasources:
  # Основной источник для дашбордов: свежие данные, скрейп раз в 5 секунд.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST
      prometheusType: Prometheus

  # Долгое хранилище из GAP-2, пригодится для графиков за две недели.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST
