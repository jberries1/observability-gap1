global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    env: gap3
    cms: bulochnaya-17

remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    write_relabel_configs:
      - target_label: site
        replacement: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    scheme: https
    metrics_path: /node/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prom-tls/gw_password
    tls_config:
      ca_file: /etc/prom-tls/ca.crt
      server_name: exporters-gw
    static_configs:
      - targets: ['exporters-gw:9443']
        labels:
          instance: cms-vm

  - job_name: nginx
    scheme: https
    metrics_path: /nginx/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prom-tls/gw_password
    tls_config:
      ca_file: /etc/prom-tls/ca.crt
      server_name: exporters-gw
    static_configs:
      - targets: ['exporters-gw:9443']
        labels:
          instance: cms-vm

  - job_name: php-fpm
    scheme: https
    metrics_path: /phpfpm/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prom-tls/gw_password
    tls_config:
      ca_file: /etc/prom-tls/ca.crt
      server_name: exporters-gw
    static_configs:
      - targets: ['exporters-gw:9443']
        labels:
          instance: cms-vm

  - job_name: mysql
    scheme: https
    metrics_path: /mysql/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prom-tls/gw_password
    tls_config:
      ca_file: /etc/prom-tls/ca.crt
      server_name: exporters-gw
    static_configs:
      - targets: ['exporters-gw:9443']
        labels:
          instance: cms-vm

  - job_name: blackbox-http
    scheme: https
    metrics_path: /blackbox/probe
    params:
      module: [http_2xx]
    basic_auth:
      username: prometheus
      password_file: /etc/prom-tls/gw_password
    tls_config:
      ca_file: /etc/prom-tls/ca.crt
      server_name: exporters-gw
    static_configs:
      - targets:
          - http://web/
          - http://web/wp-login.php
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporters-gw:9443

  - job_name: blackbox-tcp
    scheme: https
    metrics_path: /blackbox/probe
    params:
      module: [tcp_connect]
    basic_auth:
      username: prometheus
      password_file: /etc/prom-tls/gw_password
    tls_config:
      ca_file: /etc/prom-tls/ca.crt
      server_name: exporters-gw
    static_configs:
      - targets:
          - db:3306
          - php:9000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporters-gw:9443
