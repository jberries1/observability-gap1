
server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/gw.crt;
    ssl_certificate_key /etc/nginx/tls/gw.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    auth_basic           "metrics";
    auth_basic_user_file /etc/nginx/tls/htpasswd;

    access_log off;

    location = /node/metrics {
        proxy_pass http://node-exporter:9100/metrics;
    }

    location = /nginx/metrics {
        proxy_pass http://nginx-exporter:9113/metrics;
    }

    location = /phpfpm/metrics {
        proxy_pass http://phpfpm-exporter:9253/metrics;
    }

    location = /mysql/metrics {
        proxy_pass http://mysqld-exporter:9104/metrics;
    }

    location = /blackbox/probe {
        proxy_pass http://blackbox-exporter:9115/probe;
    }

    location = /healthz {
        auth_basic off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
