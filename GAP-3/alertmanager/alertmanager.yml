global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: telegram-warning
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: telegram-critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m

    - matchers:
        - severity = warning
      receiver: telegram-warning

receivers:
  - name: telegram-critical
    telegram_configs:
      - bot_token_file: /etc/am-secrets/telegram_token
        chat_id: -1000000000001
        parse_mode: ''
        message: '{{ template "telegram.message" . }}'
        send_resolved: true

  - name: telegram-warning
    telegram_configs:
      - bot_token_file: /etc/am-secrets/telegram_token
        chat_id: -1000000000002
        parse_mode: ''
        message: '{{ template "telegram.message" . }}'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname = CmsDown
    target_matchers:
      - alertname = CmsSlowResponse
    equal: ['instance']

  - source_matchers:
      - alertname = MysqlDown
    target_matchers:
      - alertname = MysqlConnectionsNearLimit
