global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: oncall
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity = info
      receiver: blackhole

receivers:
  - name: default
    webhook_configs:
      - url: http://127.0.0.1:5001/alerts
        send_resolved: true

  - name: oncall
    webhook_configs:
      - url: http://127.0.0.1:5001/oncall
        send_resolved: true

  - name: blackhole

inhibit_rules:
  - source_matchers:
      - alertname = CmsDown
    target_matchers:
      - alertname = CmsSlowResponse
    equal: ['instance']
