name: gap1

services:
  db:
    image: mariadb:11.4
    container_name: gap1-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppass
    volumes:
      - db-data:/var/lib/mysql
      - ./db/exporter-user.sql:/docker-entrypoint-initdb.d/10-exporter-user.sql:ro
    networks: [gap1]

  php:
    image: wordpress:6.8-php8.3-fpm
    container_name: gap1-php
    restart: unless-stopped
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp-data:/var/www/html
      - ./cms/php-fpm-status.conf:/usr/local/etc/php-fpm.d/zz-status.conf:ro
    networks: [gap1]

  web:
    image: nginx:1.27-alpine
    container_name: gap1-web
    restart: unless-stopped
    depends_on: [php]
    ports:
      - "8080:80"
    volumes:
      - wp-data:/var/www/html:ro
      - ./nginx/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [gap1]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: gap1-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--web.listen-address=:9100'
    networks: [gap1]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: gap1-nginx-exporter
    restart: unless-stopped
    depends_on: [web]
    command:
      - '--nginx.scrape-uri=http://web:80/stub_status'
      - '--web.listen-address=:9113'
    networks: [gap1]

  phpfpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: gap1-phpfpm-exporter
    restart: unless-stopped
    depends_on: [php]
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://php:9000/status"
      PHP_FPM_WEB_LISTEN_ADDRESS: ":9253"
    networks: [gap1]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: gap1-mysqld-exporter
    restart: unless-stopped
    depends_on: [db]
    command:
      - '--mysqld.address=db:3306'
      - '--mysqld.username=exporter'
      - '--web.listen-address=:9104'
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporterpass
    networks: [gap1]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: gap1-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [gap1]

  exporters-gw:
    image: nginx:1.27-alpine
    container_name: gap1-exporters-gw
    restart: unless-stopped
    depends_on:
      - node-exporter
      - nginx-exporter
      - phpfpm-exporter
      - mysqld-exporter
      - blackbox-exporter
    ports:
      - "9443:9443"
    volumes:
      - ./nginx/exporters-gw.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [gap1]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gap1-prometheus
    restart: unless-stopped
    depends_on: [exporters-gw]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./tls:/etc/prom-tls:ro
      - prom-data:/prometheus
    networks: [gap1]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: gap1-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    networks: [gap1]

volumes:
  db-data:
  wp-data:
  prom-data:
  am-data:

networks:
  gap1:
